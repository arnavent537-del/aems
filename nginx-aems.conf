server {
    listen 80;
    server_name arnav-enterprises.com www.arnav-enterprises.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name arnav-enterprises.com www.arnav-enterprises.com;

    ssl_certificate /etc/letsencrypt/live/arnav-enterprises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arnav-enterprises.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
